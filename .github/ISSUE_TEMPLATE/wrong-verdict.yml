name: Wrong verdict
description: logcrux said CLEAN when something was wrong, raised an alarm on a healthy log, or named the wrong incident.
labels: ["wrong-verdict"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you — every report becomes a labelled test case, so the same
        mistake cannot come back. **Redact first**: hostnames, IPs, user names,
        tokens. Keep the shape of the lines; that is what matters.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - It said CLEAN, but something failed (missed incident)
        - It raised an alarm on a healthy log (false alarm)
        - It found the incident but named it wrong
        - It did not recognise the log format
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it have said?
      placeholder: "e.g. the backup job failed: wrong repository password"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: What produced the log
      placeholder: "e.g. kopia 0.18 via `docker logs`, journalctl -b on Debian 13, /var/log/secure on RHEL 9"
    validations:
      required: true
  - type: textarea
    id: lines
    attributes:
      label: The relevant lines (redacted), ideally with ~20 lines of context
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "logcrux output: `logcrux <file> --json` (or the text output)"
      render: json
  - type: textarea
    id: doctor
    attributes:
      label: "`logcrux --doctor`"
      render: text
