[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logcrux"
dynamic = ["version"]
description = "Intelligent, fully local log analyzer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ravipati" }]
keywords = [
    "logs",
    "log-analysis",
    "log-analyzer",
    "anomaly-detection",
    "observability",
    "sre",
    "devops",
    "security",
    "siem",
    "onnx",
    "machine-learning",
    "incident-detection",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "PyYAML>=6",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/ravipatip/logcrux"
Repository = "https://github.com/ravipatip/logcrux"
Issues = "https://github.com/ravipatip/logcrux/issues"

[project.scripts]
logcrux = "logcrux.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-python-dateutil",
    "types-PyYAML",
]

[tool.hatch.version]
path = "logcrux/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["logcrux"]

# The sdist is an EXPLICIT allow-list, not "everything not git-ignored" --
# list only what a user needs to build/run/test the package.
[tool.hatch.build.targets.sdist]
include = [
    "logcrux",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=logcrux --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
strict = true
python_version = "3.11"

# onnxruntime ships no py.typed marker / stubs; treat it as untyped rather than
# scattering per-import ignores through the inference modules.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# Test functions are pytest cases (no meaningful return type, fixture-injected
# args); enforcing full strict annotations there is noise, not safety. Source
# under logcrux/ stays fully strict.
# union-attr is disabled only for tests: assertions on a parser's
# ``ParsedEvent | None`` result would crash loudly (failing the test) if the
# value were None, so the static guard adds nothing here.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disable_error_code = ["union-attr"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "UP017", "B905", "S110", "B904", "S108", "S106", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test files embed real log-line samples verbatim; wrapping them would alter the
# data under test, so line-length is not enforced there.
"tests/**" = ["E501"]
